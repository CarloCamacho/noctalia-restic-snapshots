# Restic Snapshots — scheduled restic backups, a snapshot browser, staging restore, and
# dry-run-gated retention.
#
# Execution model (verified in docs/phase0-findings.md):
#   every restic invocation runs as a detached generated script writing
#   <pluginDataDir>/jobs/<token>.jsonl + .status + .exit. Detached runs are not subject to the
#   runAsync timeout cap (50-60000ms), which a real backup would blow through.
#   The password is passed with `--password-file <path>` — never as an env var or a value.
#
# plugin_api 30: the panel uses versioned panel options and any entry may use the API up to 30.

id          = "carlocamacho/restic-snapshots"
name        = "Restic Snapshots"
icon        = "archive"
version     = "0.2.0"
plugin_api  = 30
author      = "carlocamacho"
license     = "MIT"
dependencies = ["restic"]
tags         = ["system", "panel", "service", "shortcut", "utility"]
description  = "Scheduled restic backups with a snapshot browser, staging restore, and dry-run-gated retention."

[[setting]]
key             = "repository"
type            = "string"
label_key       = "settings.repository.label"
description_key = "settings.repository.description"
default         = ""

[[setting]]
key             = "password_file"
type            = "file"
label_key       = "settings.password_file.label"
description_key = "settings.password_file.description"
default         = ""

[[setting]]
key             = "env_file"
type            = "file"
label_key       = "settings.env_file.label"
description_key = "settings.env_file.description"
default         = ""

[[setting]]
key             = "backup_paths"
type            = "string_list"
label_key       = "settings.backup_paths.label"
description_key = "settings.backup_paths.description"
default         = []

[[setting]]
key             = "backup_tags"
type            = "string_list"
label_key       = "settings.backup_tags.label"
description_key = "settings.backup_tags.description"
default         = ["noctalia"]

[[setting]]
key             = "exclude_file"
type            = "file"
label_key       = "settings.exclude_file.label"
description_key = "settings.exclude_file.description"
default         = ""

[[setting]]
key             = "mode"
type            = "select"
label_key       = "settings.mode.label"
description_key = "settings.mode.description"
default         = "plugin"
options = [
  { value = "plugin",  label_key = "settings.mode.plugin" },
  { value = "observe", label_key = "settings.mode.observe" },
]

[[setting]]
key             = "interval_minutes"
type            = "int"
label_key       = "settings.interval_minutes.label"
description_key = "settings.interval_minutes.description"
default         = 60
min             = 5
max             = 1440

[[setting]]
key             = "job_timeout_minutes"
type            = "int"
label_key       = "settings.job_timeout_minutes.label"
description_key = "settings.job_timeout_minutes.description"
default         = 180
min             = 5
max             = 2880

[[setting]]
key             = "check_interval_hours"
type            = "int"
label_key       = "settings.check_interval_hours.label"
description_key = "settings.check_interval_hours.description"
default         = 0
min             = 0
max             = 720

[[setting]]
key             = "stale_after_hours"
type            = "int"
label_key       = "settings.stale_after_hours.label"
description_key = "settings.stale_after_hours.description"
default         = 0
min             = 0
max             = 720

[[setting]]
key       = "keep_last"
type      = "int"
label_key = "settings.keep_last.label"
default   = 7
min       = 0
max       = 365

[[setting]]
key       = "keep_daily"
type      = "int"
label_key = "settings.keep_daily.label"
default   = 7
min       = 0
max       = 365

[[setting]]
key       = "keep_weekly"
type      = "int"
label_key = "settings.keep_weekly.label"
default   = 4
min       = 0
max       = 104

[[setting]]
key       = "keep_monthly"
type      = "int"
label_key = "settings.keep_monthly.label"
default   = 6
min       = 0
max       = 120

[[setting]]
key             = "restore_target"
type            = "folder"
label_key       = "settings.restore_target.label"
description_key = "settings.restore_target.description"
default         = "~/restore"

[[setting]]
key             = "restore_allow_roots"
type            = "string_list"
label_key       = "settings.restore_allow_roots.label"
description_key = "settings.restore_allow_roots.description"
default         = []

[[setting]]
key             = "check_subset"
type            = "string"
label_key       = "settings.check_subset.label"
description_key = "settings.check_subset.description"
default         = "1/100"
advanced        = true

[[setting]]
key       = "restic_bin"
type      = "string"
label_key = "settings.restic_bin.label"
default   = "restic"
advanced  = true

[[service]]
id    = "service"
entry = "service.luau"

[[widget]]
id    = "status"
entry = "widget.luau"

  [[widget.setting]]
  key       = "show_count"
  type      = "bool"
  label_key = "settings.widget.show_count.label"
  default   = false

  [[widget.setting]]
  key       = "show_staleness"
  type      = "bool"
  label_key = "settings.widget.show_staleness.label"
  default   = true

[[shortcut]]
id    = "backup_now"
entry = "shortcut.luau"

[[panel]]
id                       = "browser"
entry                    = "panel.luau"
width                    = 820
height                   = 620
placement                = "floating"
position                 = "center"
keyboard_focus           = "exclusive"
dismiss_on_outside_click = true
